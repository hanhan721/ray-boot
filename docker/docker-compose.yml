name: ray-middleware
services:
  # ======================== PostgreSQL 数据库 ========================
  postgres:
    image: registry.cn-heyuan.aliyuncs.com/ray_docker_images/postgres:18-alpine
    container_name: ray-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-ray}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../docs/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - ray-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ======================== Valkey 缓存 ========================
  valkey:
    image: registry.cn-heyuan.aliyuncs.com/ray_docker_images/valkey:9.1-alpine
    container_name: ray-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT}:6379"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: >-
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --save 3600 1
      --save 300 100
    volumes:
      - valkey-data:/data
    networks:
      - ray-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${VALKEY_PASSWORD} valkey-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ======================== RustFS 对象存储 ========================
  rustfs:
    image: registry.cn-heyuan.aliyuncs.com/ray_docker_images/rustfs:1.0.4
    container_name: ray-rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_API_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    command: --console-enable /data
    volumes:
      - rustfs-data:/data
    networks:
      - ray-net
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:

networks:
  ray-net:
    driver: bridge
