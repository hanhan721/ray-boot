server:
  port: 9527

spring:
  application:
    name: ray-boot
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT:5432}/${PG_DATABASE}?stringtype=unspecified
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          time-between-eviction-runs: 30s
        shutdown-timeout: 5s

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
    encoding:
      charset: UTF-8

  # Jackson 配置 (Jackson 3 默认使用 ISO-8601 日期格式)
  jackson:
    time-zone: Asia/Shanghai

# 项目配置
ray:
  api-docs:
    enabled: ${RAY_API_DOCS_ENABLED:false} # 开发调试时显式开启
  http:
    # 可信代理 IP（精确地址，逗号分隔）；入口代理须追加实际连接地址或覆盖 X-Forwarded-For。
    trusted-proxies: ${RAY_HTTP_TRUSTED_PROXIES:127.0.0.1,::1}
  cors:
    # 跨域白名单（精确域名，逗号分隔）。生产通过环境变量 RAY_CORS_ALLOWED_ORIGINS 覆盖，例如 https://admin.example.com
    allowed-origins: ${RAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  snowflake:
    # 机器 ID（0~7），通过环境变量注入；多实例部署时各实例必须不同
    machine-id: ${RAY_SNOWFLAKE_MACHINE_ID:0}
  auth:
    token:
      access-expire: 30       # Access Token 过期时间（分钟）
      refresh-expire: 7       # Refresh Token 过期时间（天）
      refresh-salt: "${RAY_AUTH_REFRESH_SALT}"
    security:
      max-login-attempts: 5       # 账号累计失败达到阈值后开始冷却
      failure-window-minutes: 30 # 失败次数累计窗口，不随失败延长
      initial-cooldown-seconds: 1
      max-cooldown-seconds: 30
    super-admin:
      role-codes:             # 超管角色代码集合，拥有最高权限
        - admin                # 可配置多个超管角色
  storage:
    storage-type: RUST_FS      # 存储类型：LOCAL / RUST_FS
    upload-concurrency: 8      # 每实例最多同时处理的上传，超出立即返回可重试错误
    operation-timeout: 2m      # 存储操作超时，合法范围大于0且不超过10分钟
    local:
      base-path: ./uploads     # 本地存储根目录
    access:
      public-base-url: ${RAY_STORAGE_PUBLIC_BASE_URL}
      sign-secret: "${RAY_STORAGE_SIGN_SECRET}"
    rust-fs:
      endpoint: ${RUSTFS_ENDPOINT}
      public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:}
      access-key: ${RUSTFS_ACCESS_KEY}
      secret-key: ${RUSTFS_SECRET_KEY}
      bucket: ${RUSTFS_BUCKET}
  schedule:
    shutdown-grace-seconds: 30       # 停机时等待在途任务优雅结束
    shutdown-interrupt-seconds: 30   # 中断后每等待此秒数仍未退出则告警并继续等待
    # 容器终止宽限期须覆盖任务实际收尾时间；不响应中断时不会提前关闭依赖资源

# 加密配置
crypto:
  aes-key: "${PARAM_ENCRYPT_KEY}"  # AES-256 密钥 (32 字节的 Base64 编码)，通过环境变量注入

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ray.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id  # 雪花算法
      logic-delete-field: deleted
      logic-delete-value: "true"
      logic-not-delete-value: "false"

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: ${ray.api-docs.enabled}
  swagger-ui:
    enabled: ${ray.api-docs.enabled}

scalar:
  enabled: ${ray.api-docs.enabled}
  # starter 自带页面挪到内部路径，仅提供 scalar.js；/scalar 由 ScalarController 接管（默认选中分组）
  # 注意：不能改为 /scalar，否则与 ScalarController 映射冲突导致启动失败
  path: /scalar-starter

# 日志配置 (详细配置见 logback-spring.xml)
logging:
  config: classpath:logback-spring.xml
